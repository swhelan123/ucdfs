services:
  attendance-bot:
    build: .
    container_name: attendance-bot
    restart: unless-stopped
    ports:
      - "3978:3978"
    # Secrets live in .env (gitignored). Copy .env.example to .env and fill it in.
    env_file:
      - .env
    volumes:
      # Profile photos. This has to be a mount: the image is rebuilt in place on
      # every deploy, so anything written inside the container and not mounted
      # out is gone the next time we ship. Kept out of static/ deliberately —
      # Dockerfile COPYs static/ into the image, and StaticFiles would serve
      # these to anyone with the URL. They go out through /media/avatars/…
      # instead, which sits behind the auth middleware.
      - ./data/uploads:/app/uploads
