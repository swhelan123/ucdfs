<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCDFS Glossary</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<meta name="theme-color" content="#15386e">
<link rel="stylesheet" href="/static/shared.css">
<style>
/* Page-local only. Header, chips, cards, buttons and the text input come from
   shared.css. */
:root { --page-max: 820px; }

.intro { color: var(--muted); font-size: 0.88rem; line-height: 1.55; margin-bottom: 16px; }
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
.toolbar .text-input { flex: 1; min-width: 0; }
.add-btn { flex-shrink: 0; white-space: nowrap; }
.chips { margin-bottom: 18px; }

.term-list { padding: 4px 18px; margin-bottom: 26px; }
.term { padding: 13px 0; border-bottom: 1px solid var(--border); transition: background 0.6s; }
.term:last-child { border-bottom: none; }
.term.flash { background: var(--purple-bg); }
.term-head { display: flex; align-items: baseline; gap: 10px; }
.term-name { flex: 1; min-width: 0; font-weight: 800; font-size: 0.95rem; }
.term-long { font-weight: 500; color: var(--muted); font-size: 0.82rem; margin-left: 6px; }
/* Paragraph breaks typed into the editor are kept. */
.term-text { font-size: 0.86rem; line-height: 1.55; margin-top: 4px; white-space: pre-line; }
.term-edit {
  flex-shrink: 0; border: none; background: none; cursor: pointer; padding: 2px 6px;
  font: inherit; font-size: 0.75rem; font-weight: 700; color: var(--muted); border-radius: 6px;
}
.term-edit:hover { color: var(--indigo); background: var(--indigo-bg); }
.gone { display: none; }

/* ── The editor ──
   A dialog rather than editing in place: a definition is a few sentences, and
   a textarea opening inside a list of sixty entries shoves the rest of the
   page around under your thumb. */
.ed-bg {
  position: fixed; inset: 0; z-index: 1500; background: rgba(15,23,42,.55);
  display: flex; align-items: center; justify-content: center; padding: 18px;
  overflow-y: auto;
}
.ed-bg.gone { display: none; }
.ed { width: 100%; max-width: 480px; margin: auto; padding: 22px 20px; }
.ed-h { font-size: 1.1rem; font-weight: 800; margin-bottom: 14px; }
.ed-field { display: block; margin-bottom: 12px; }
.ed-label { display: block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--muted); margin-bottom: 5px; }
.ed-opt { font-weight: 600; text-transform: none; letter-spacing: 0; }
.ed-field .text-input { width: 100%; box-sizing: border-box; }
.ed-area { min-height: 110px; resize: vertical; font-family: inherit; line-height: 1.5; }
.ed-meta { font-size: 0.74rem; color: var(--muted); margin: -2px 0 12px; }
.ed-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.ed-spacer { flex: 1; }
.ed-delete {
  border: none; background: none; cursor: pointer; padding: 8px 4px;
  font: inherit; font-size: 0.8rem; font-weight: 700; color: var(--red-text);
}
.ed-delete:hover { text-decoration: underline; }
</style>
</head>
<body>

<div id="main" style="display:none">
  <header>
    <div class="header-inner">
      <a class="back-link" href="/" title="All tools" aria-label="All tools">←</a>
      <div class="logo">📖</div>
      <div class="header-text">
        <div class="header-title">Glossary</div>
        <div class="header-sub">The words you'll hear in the workshop</div>
      </div>
      <div class="name-pill">
        <div class="pill-avatar" id="pill-avatar"></div>
        <span class="pill-name" id="pill-name"></span>
        <span class="pill-change" onclick="UCDFS.signOut()">sign out</span>
      </div>
    </div>
  </header>

  <div class="page">
    <p class="intro">
      Everyone was new once, and nobody minds being asked. This is a head start,
      not the rulebook: where the two disagree, the current year's rules win.
      <span id="intro-who">Something missing or wrong? Tell your captain.</span>
    </p>
    <div class="toolbar">
      <input class="text-input" id="q" type="search" placeholder="Search, e.g. BSPD or skidpad"
             aria-label="Search the glossary" autocomplete="off">
      <button class="btn btn-dark btn-sm add-btn gone" id="add-btn" type="button">+ Add a term</button>
    </div>
    <div class="chips" id="chips"></div>
    <div id="groups"></div>
    <div class="empty gone" id="none">
      <div class="empty-icon">🔍</div>
      <div class="empty-text" id="none-text"></div>
    </div>
    <div class="foot">UCD Formula Student · <span id="foot-count"></span></div>
  </div>
</div>

<div class="ed-bg gone" id="ed-bg">
  <form class="card ed" id="ed" role="dialog" aria-modal="true" aria-labelledby="ed-h" novalidate>
    <div class="ed-h" id="ed-h">Add a term</div>
    <label class="ed-field">
      <span class="ed-label">Term</span>
      <input class="text-input" id="f-term" autocomplete="off" placeholder="e.g. TSAL">
    </label>
    <label class="ed-field">
      <span class="ed-label">Stands for <span class="ed-opt">(optional)</span></span>
      <input class="text-input" id="f-exp" autocomplete="off" placeholder="e.g. Tractive System Active Light">
    </label>
    <label class="ed-field">
      <span class="ed-label">Category</span>
      <select class="text-input" id="f-cat"></select>
    </label>
    <label class="ed-field">
      <span class="ed-label">What it means</span>
      <textarea class="text-input ed-area" id="f-def"
                placeholder="Say it the way you'd explain it to someone on their first day."></textarea>
    </label>
    <div class="ed-meta" id="f-meta"></div>
    <div class="ed-actions">
      <button class="ed-delete" id="f-delete" type="button">Delete</button>
      <span class="ed-spacer"></span>
      <button class="btn btn-ghost btn-sm" id="f-cancel" type="button">Cancel</button>
      <button class="btn btn-dark btn-sm" id="f-save" type="submit">Save</button>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="/static/shared.js"></script>
<script>
/* The terms are rows (migrations/016), edited here by admins, committee and
   captains. The server decides who may; the buttons only follow its answer. */
const esc = s => UCDFS.esc(s);
let DATA = { groups: [], terms: [], can_edit: false, ready: true };
let FILTER = 'all';
let editing = null;     // the term open in the editor, or null when adding

const $ = id => document.getElementById(id);

async function load() {
  const d = await fetch('/api/glossary').then(r => r.ok ? r.json() : null).catch(() => null);
  if (!d) { UCDFS.toast("Couldn't load the glossary"); return; }
  DATA = d;
  $('add-btn').classList.toggle('gone', !d.can_edit);
  $('intro-who').textContent = d.can_edit
    ? 'You can add and change entries: + Add a term, or Edit beside any of them.'
    : 'Something missing or wrong? Tell your captain.';
  ['term', 'expansion', 'definition'].forEach(k => {
    const el = { term: 'f-term', expansion: 'f-exp', definition: 'f-def' }[k];
    if (d.limits && d.limits[k]) $(el).maxLength = d.limits[k];
  });
  renderChips();
  render();
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const terms = DATA.terms.filter(t =>
    (FILTER === 'all' || t.category === FILTER) &&
    (!q || (t.term + ' ' + t.expansion + ' ' + t.definition).toLowerCase().includes(q)));
  $('groups').innerHTML = DATA.groups.map(g => {
    const rows = terms.filter(t => t.category === g.id);
    if (!rows.length) return '';
    return `<div class="section-label">${esc(g.name)}</div>
      <div class="card term-list">${rows.map(t => `
        <div class="term" id="t-${esc(t.id)}">
          <div class="term-head">
            <div class="term-name">${esc(t.term)}${t.expansion ? `<span class="term-long">${esc(t.expansion)}</span>` : ''}</div>
            ${DATA.can_edit ? `<button class="term-edit" type="button" data-id="${esc(t.id)}">Edit</button>` : ''}
          </div>
          <div class="term-text">${esc(t.definition)}</div>
        </div>`).join('')}</div>`;
  }).join('');

  let none = '';
  if (!DATA.ready) none = "The glossary isn't set up on this site yet.";
  else if (!DATA.terms.length) none = DATA.can_edit ? 'Nothing here yet. Add the first term.' : 'Nothing here yet.';
  else if (!terms.length) none = 'Nothing matches that. Ask in the team chat, then tell your captain so it can go in here.';
  $('none-text').textContent = none;
  $('none').classList.toggle('gone', !none);
  $('foot-count').textContent = `${DATA.terms.length} terms`;
}

function renderChips() {
  const el = $('chips');
  el.innerHTML = '';
  [{ id: 'all', name: 'All' }].concat(DATA.groups).forEach(g => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    if (FILTER === g.id) b.classList.add('active');
    b.textContent = g.name;
    b.onclick = () => { FILTER = g.id; renderChips(); render(); };
    el.appendChild(b);
  });
}

// ── Editing ────────────────────────────────────────────────────────────────

function openEditor(term) {
  editing = term || null;
  $('ed-h').textContent = term ? 'Edit ' + term.term : 'Add a term';
  $('f-cat').innerHTML = DATA.groups.map(g =>
    `<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');
  $('f-term').value = term ? term.term : '';
  $('f-exp').value  = term ? term.expansion : '';
  $('f-def').value  = term ? term.definition : '';
  $('f-cat').value  = term ? term.category
                    : (FILTER !== 'all' ? FILTER : DATA.groups[0].id);
  const when = term && term.updated_at ? new Date(term.updated_at)
    .toLocaleDateString('en-IE', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  $('f-meta').textContent = term && term.updated_by
    ? `Last changed by ${term.updated_by}${when ? ', ' + when : ''}` : '';
  $('f-delete').classList.toggle('gone', !term);
  $('ed-bg').classList.remove('gone');
  $('f-term').focus();
}

function closeEditor() {
  $('ed-bg').classList.add('gone');
  editing = null;
}

async function post(path, body) {
  const r = await fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || "Couldn't save that");
  return d;
}

async function save(e) {
  e.preventDefault();
  const body = {
    term: $('f-term').value, expansion: $('f-exp').value,
    definition: $('f-def').value, category: $('f-cat').value,
  };
  if (!body.term.trim()) { UCDFS.toast('A term needs a name'); $('f-term').focus(); return; }
  if (!body.definition.trim()) { UCDFS.toast('Say what it means'); $('f-def').focus(); return; }
  if (editing) body.id = editing.id;
  const btn = $('f-save');
  btn.disabled = true;
  try {
    const d = await post('/api/glossary', body);
    const added = !editing;
    closeEditor();
    // A new term the current search or chip would hide should still be seen.
    if (added) { $('q').value = ''; FILTER = 'all'; }
    await load();
    const row = $('t-' + d.id);
    if (row) {
      row.scrollIntoView({ block: 'center', behavior: 'smooth' });
      row.classList.add('flash');
      setTimeout(() => row.classList.remove('flash'), 1400);
    }
    UCDFS.toast(added ? 'Added' : 'Saved');
  } catch (err) {
    UCDFS.toast(err.message);
  } finally {
    btn.disabled = false;
  }
}

async function remove() {
  if (!editing) return;
  if (!confirm(`Delete “${editing.term}” from the glossary? There's no undo.`)) return;
  try {
    await post('/api/glossary/delete', { id: editing.id, term: editing.term });
    closeEditor();
    await load();
    UCDFS.toast('Deleted');
  } catch (err) {
    UCDFS.toast(err.message);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  UCDFS.gate(() => {
    UCDFS.renderPill();
    $('q').addEventListener('input', render);
    $('add-btn').addEventListener('click', () => openEditor(null));
    $('groups').addEventListener('click', e => {
      const b = e.target.closest('.term-edit');
      if (b) openEditor(DATA.terms.find(t => t.id === b.dataset.id));
    });
    $('ed').addEventListener('submit', save);
    $('f-cancel').addEventListener('click', closeEditor);
    $('f-delete').addEventListener('click', remove);
    $('ed-bg').addEventListener('mousedown', e => { if (e.target === $('ed-bg')) closeEditor(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !$('ed-bg').classList.contains('gone')) closeEditor();
    });
    load();
  });
});
</script>
</body>
</html>
