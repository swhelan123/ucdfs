<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCDFS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/img/favicon-16.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<meta name="theme-color" content="#15386e">
<link rel="stylesheet" href="/static/shared.css">
<style>
/* Dashboard-only styles. Everything else comes from shared.css. */
:root { --page-max: 980px; }

/* ── Held back until it is finished ──
   This page is assembled from three requests, and it used to show its work:
   the tools grid appeared first, then the headline and the feed a beat later,
   with a "…" in every tile in between. Hidden until boot() has drawn it once,
   then faded in as a whole. See reveal() in the script.

   Deliberately here and not in shared.css. .page is every card page, and the
   others do not fetch the same way; hiding all of them from one rule would
   mean a page that never calls reveal() never appears at all.

   visibility, not opacity alone. An element at opacity:0 is still laid out,
   still hit-tested and still in the tab order, so for the second or so before
   .ready lands you could tab into, or click, a dashboard you cannot see.
   visibility:hidden takes it out of all three, and still animates, because the
   flip to visible is instant while the fade is not. */
.page { opacity: 0; visibility: hidden; }
body.ready .page { opacity: 1; visibility: visible; transition: opacity .16s ease-out; }
@media (prefers-reduced-motion: reduce) { body.ready .page { transition: none; } }

/* ── What you look at while it is held back ──
   The rule above hides the page; on a slow connection that left a blank
   screen for up to 2.5s, which reads as broken rather than as busy.

   Driven entirely by `body.ready`, the class reveal() already sets. No JS
   here on purpose: reveal() is idempotent and called from exactly two
   places, and the comment above it asks for no third caller. A veil that
   hides itself off the same class cannot drift out of step with the page it
   is covering, including on the 2.5s timeout path. */
#load-veil {
  position: fixed; inset: 0; z-index: 500;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
}
body.ready #load-veil {
  opacity: 0; visibility: hidden;
  /* Fades with the page rather than cutting, and the visibility delay keeps
     it painted for the length of that fade instead of vanishing on frame 1. */
  transition: opacity .16s ease-out, visibility 0s .16s;
}

/* The ring, not the veil, is what fades in late. The veil is already the page
   background, so holding it there from the first frame costs nothing visible,
   while a spinner that appears for 80ms on a fast load is just a flinch. Below
   about a third of a second nobody feels they waited, so nothing is drawn. */
.dash-ring { opacity: 0; animation: ring-in .2s ease-out .35s forwards; }
@keyframes ring-in { to { opacity: 1; } }

.dash-ring svg { display: block; animation: ring-spin 1.5s linear infinite; }
.dash-ring circle {
  fill: none; stroke: var(--indigo); stroke-width: 4; stroke-linecap: round;
  /* r=20, so the circumference is ~125.7 and the dasharray pairs below sum to
     it. The arc grows and shrinks as the whole thing turns, which is the bit
     that makes it read as working rather than as a timer. */
  animation: ring-dash 1.5s ease-in-out infinite;
}
@keyframes ring-spin { to { transform: rotate(360deg); } }
@keyframes ring-dash {
  0%   { stroke-dasharray: 6 120;  stroke-dashoffset: 0; }
  50%  { stroke-dasharray: 80 46;  stroke-dashoffset: -18; }
  100% { stroke-dasharray: 6 120;  stroke-dashoffset: -125; }
}

/* Rotation is the part that causes trouble for people who ask for less of it,
   so it goes and the ring stays: a still arc breathing in place still says
   "working", where nothing at all says "broken". */
@media (prefers-reduced-motion: reduce) {
  body.ready #load-veil { transition: none; }
  .dash-ring svg { animation: none; }
  .dash-ring circle {
    stroke-dasharray: 80 46; animation: ring-fade 1.6s ease-in-out infinite;
  }
  @keyframes ring-fade { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
}

/* ── Greeting ── */
.greeting { margin-bottom: 26px; }
.greet-hi   { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
.greet-date { font-size: 0.85rem; color: var(--muted); margin-top: 3px; }
@media (min-width: 720px) { .greet-hi { font-size: 1.9rem; } }

/* ── Countdown: days to the competition ── */
.countdown {
  display: flex; align-items: center; gap: 16px;
  background: var(--ucd-navy); color: #fff;
  border-radius: 16px; padding: 15px 18px; margin-bottom: 13px;
  box-shadow: var(--shadow-md);
}
.cd-num {
  font-size: 2.1rem; font-weight: 800; line-height: 1; flex-shrink: 0;
  color: var(--ucd-gold); letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;   /* so it doesn't jiggle day to day */
}
.cd-body { flex: 1; min-width: 0; }
.cd-main { font-size: 0.95rem; font-weight: 700; }
.cd-sub  { font-size: 0.72rem; opacity: 0.72; margin-top: 3px; }
.cd-tag {
  font-size: 0.57rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.07em; padding: 2px 6px; border-radius: 5px;
  border: 1px solid rgba(255,255,255,0.32); margin-left: 7px; white-space: nowrap;
}
.cd-next {
  font-size: 0.72rem; margin-top: 5px; padding-top: 5px;
  border-top: 1px solid rgba(255,255,255,0.14); opacity: 0.85;
}

/* ── Who's in the workshop right now ── */
.nowbar {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--border);
  border-left: 3px solid var(--green);
  border-radius: 14px; padding: 11px 15px;
  /* Pulls up against the headline's 28px when shown; when hidden it is
     display:none, so the margin collapses away and the headline keeps its gap. */
  margin: -15px 0 28px;
  box-shadow: var(--shadow-sm);
}
.now-avs { display: flex; flex-shrink: 0; }
.now-av {
  width: 29px; height: 29px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.58rem; font-weight: 800; color: #fff;
  border: 2px solid var(--card); margin-left: -9px; flex-shrink: 0;
}
.now-av:first-child { margin-left: 0; }
.now-more  { background: var(--muted); }
.now-body  { flex: 1; min-width: 0; }
.now-main  { font-size: 0.87rem; font-weight: 700; }
.now-sub   { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }
.now-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--green); animation: livepulse 2.2s ease-in-out infinite;
}
@keyframes livepulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ── Activity feed ── */
.feed { padding: 4px 16px; margin-bottom: 30px; }
.feed-item {
  display: flex; align-items: baseline; gap: 11px;
  padding: 11px 0; border-bottom: 1px solid var(--border);
  font-size: 0.84rem; line-height: 1.45;
}
.feed-item:last-child { border-bottom: none; }
.feed-icon  { flex-shrink: 0; width: 20px; text-align: center; font-size: 0.95rem; }
.feed-text  { flex: 1; min-width: 0; }
.feed-actor { font-weight: 700; }
.feed-when  { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; white-space: nowrap; }
/* Only drawn with admin override on. Faint until hovered. It sits on a feed
   everybody reads and it deletes somebody else's line. */
.feed-x {
  flex-shrink: 0; border: none; background: none; cursor: pointer; padding: 0 2px;
  font: inherit; font-size: 0.95rem; line-height: 1; color: var(--muted); opacity: 0.45;
}
.feed-x:hover { opacity: 1; color: #c0392b; }
.feed-x:disabled { opacity: 0.25; cursor: default; }

/* ── Headline strip: the one thing worth knowing right now ── */
.headline {
  display: flex; align-items: center; gap: 13px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 14px 17px; margin-bottom: 28px;
  box-shadow: var(--shadow-sm);
}
.headline-icon { font-size: 1.5rem; flex-shrink: 0; line-height: 1; }
.headline-body { flex: 1; min-width: 0; }
.headline-main { font-size: 0.92rem; font-weight: 700; }
.headline-sub  { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

/* ── Applet grid ── */
.applet-grid {
  display: grid; gap: 13px; margin-bottom: 30px;
  grid-template-columns: 1fr;
}
@media (min-width: 620px) { .applet-grid { grid-template-columns: 1fr 1fr; } }

.applet {
  display: flex; align-items: flex-start; gap: 14px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 18px;
  text-decoration: none; color: var(--text);
  box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  transition: transform 0.14s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow 0.14s, border-color 0.14s;
}
.applet::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--accent, var(--indigo));
  opacity: 0; transition: opacity 0.14s;
}
/* Hover lives on the slot, not the card. The star is a sibling of the <a>
   rather than a child. A <button> inside an <a> is invalid and browsers split
   the anchor around it, so hovering the star would otherwise drop the card
   back down while the pointer was still over it. */
.applet-slot:hover > .applet {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg); border-color: var(--accent, var(--indigo));
}
.applet-slot:hover > .applet::before { opacity: 1; }
.applet:active { transform: scale(0.985); transition-duration: 0.05s; }

.applet-slot { position: relative; display: flex; }
.applet-slot > .applet { flex: 1; min-width: 0; padding-right: 46px; }

.applet-icon {
  width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem; background: var(--accent-bg, var(--indigo-bg));
}
.applet-body  { flex: 1; min-width: 0; }
.applet-name  { font-weight: 700; font-size: 0.98rem; display: flex;
                align-items: center; gap: 7px; flex-wrap: wrap; }
.applet-blurb { font-size: 0.78rem; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.applet-stat  {
  font-size: 0.78rem; font-weight: 700; margin-top: 9px;
  color: var(--accent, var(--indigo));
  display: flex; align-items: center; gap: 6px;
}
.applet-stat.loading { color: var(--muted); font-weight: 500; }
.stat-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent, var(--indigo)); flex-shrink: 0;
}

/* status variants */
.applet.quiet { opacity: 0.62; }
.applet.quiet:hover { opacity: 1; }
.applet.soon {
  cursor: default; border-style: dashed; box-shadow: none; background: transparent;
}
.applet-slot:hover > .applet.soon { transform: none; box-shadow: none; border-color: var(--border); }
.applet-slot:hover > .applet.soon::before { opacity: 0; }
.applet.soon .applet-icon { opacity: 0.5; }

/* ── Favourite star ──
   Always drawn, faint when off, rather than revealed on hover. Half the team
   opens this on a phone, and a control that only exists on hover does not
   exist on a touch screen. */
.fav-btn {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  width: 30px; height: 30px; border-radius: 9px; padding: 0;
  border: none; background: transparent; cursor: pointer;
  font-size: 0.92rem; line-height: 1; color: var(--muted);
  opacity: 0.3; transition: opacity 0.14s, background 0.14s, transform 0.14s;
}
.applet-slot:hover .fav-btn { opacity: 0.75; }
.fav-btn:hover { background: var(--bg); opacity: 1 !important; transform: scale(1.12); }
.fav-btn.on, .applet-slot:hover .fav-btn.on { opacity: 1; color: var(--amber); }
.fav-btn:disabled { cursor: wait; }

/* The empty state carries its weight: it is the only thing on the page that
   says the star exists, so it stays put rather than collapsing the section.
   A quiet line of text, not a card. It is an instruction, and dressing it up
   as a tile makes the section look like it holds one thing already.
   The bottom margin matches .applet-grid so the block below sits where it
   would if there were favourites here. */
.fav-empty {
  text-align: center; font-style: italic;
  font-size: 0.82rem; color: var(--muted);
  padding: 2px 0 6px; margin-bottom: 30px;
}

.tag {
  font-size: 0.6rem; font-weight: 800; text-transform: uppercase;
  letter-spacing: 0.07em; padding: 2px 7px; border-radius: 6px;
  background: var(--bg); color: var(--muted); border: 1px solid var(--border);
}
.tag-soon  { background: var(--indigo-bg); color: var(--indigo); border-color: var(--indigo-border); }
.tag-quiet { background: var(--amber-bg);  color: var(--amber);  border-color: var(--amber-border); }
.ext-arrow { font-size: 0.7rem; color: var(--muted); }


</style>

<!-- No CSS fallback here on purpose. #main is display:none until the script
     shows it, and every tile, chip and feed row is built by JS from an API,
     so revealing .page without scripting would uncover an empty shell, not a
     readable page. Say so instead. -->
<noscript><style>
  .page { opacity: 1; visibility: visible; }
  /* Nothing will ever call reveal(), so the veil would spin over the note
     below until the tab was closed. A spinner for a page that is not coming
     is the one thing worse than no spinner. */
  #load-veil { display: none; }
  .noscript-note {
    margin: 40px auto; max-width: 30rem; padding: 18px 20px; border-radius: 14px;
    background: #fff; border: 1px solid #e2e8f0; text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
  }
</style></noscript>
</head>
<body>

<noscript>
  <div class="noscript-note">
    <strong>This page needs JavaScript.</strong><br>
    The dashboard is built in the browser from the team's data, so there is
    nothing to show without it. Everything else on the site works the same way.
  </div>
</noscript>

<!-- ── Held-back veil ──
     Outside #main, which is display:none until the script shows it. role=status
     rather than an aria-live region with text: screen readers announce the
     accessible name once, and there is no progress to narrate afterwards. -->
<div id="load-veil" role="status" aria-label="Loading the dashboard">
  <div class="dash-ring">
    <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="20"></circle>
    </svg>
  </div>
</div>

<!-- ── Main ── -->
<div id="main" style="display:none">
  <header>
    <div class="header-inner">
      <img class="logo-mark" src="/static/img/logo-96.png"
           alt="UCD Formula Student" width="40" height="40">
      <div class="header-text">
        <div class="header-title">UCDFS</div>
        <div class="header-sub">Team tools</div>
      </div>
      <div class="name-pill">
        <div class="pill-avatar" id="pill-avatar"></div>
        <span class="pill-name" id="pill-name"></span>
        <span class="pill-change" onclick="UCDFS.signOut()">sign out</span>
      </div>
    </div>
  </header>

  <div class="page">
    <div class="greeting">
      <div class="greet-hi"   id="greet-hi">Hello</div>
      <div class="greet-date" id="greet-date"></div>
    </div>

    <div class="countdown" id="countdown" style="display:none"></div>

    <div class="headline" id="headline">
      <div class="headline-icon">⏳</div>
      <div class="headline-body">
        <div class="headline-main">Loading…</div>
      </div>
    </div>

    <div class="nowbar" id="nowbar" style="display:none"></div>

    <!-- Starred cards, copied to the top. The heading stays even when there are
         none: it is where the empty state tells you the star exists at all,
         which is the only place anybody would find out. -->
    <div id="fav-block">
      <div class="section-label">Favourites</div>
      <div class="applet-grid" id="applet-favourites"></div>
      <div class="fav-empty" id="fav-empty">
        Nothing pinned yet. Tap the ☆ on any tool to keep it up here.
      </div>
    </div>

    <div class="section-label">Tools</div>
    <div class="chips" id="subteam-chips"></div>
    <div class="applet-grid" id="applet-grid"></div>

    <!-- Further blocks (currently just "Last season") are rendered here from
         the groups /api/applets sends, so adding one stays a registry change. -->
    <div id="applet-groups"></div>

    <div class="section-label">Recent activity</div>
    <div class="card feed" id="feed"></div>

    <div class="foot">
      UCD Formula Student · <span id="foot-count"></span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/shared.js"></script>
<script>
/* Maps an applet's accent name to the shared.css tokens the card uses. */
const ACCENTS = {
  indigo: ['var(--indigo)', 'var(--indigo-bg)'],
  purple: ['var(--purple)', 'var(--purple-bg)'],
  green:  ['var(--green)',  'var(--green-bg)'],
  amber:  ['var(--amber)',  'var(--amber-bg)'],
  teal:   ['var(--teal)',   'var(--teal-bg)'],
  red:    ['var(--red)',    'var(--red-bg)'],
};

function greet() {
  const h = new Date().getHours();
  if (h < 12) return 'Morning';
  if (h < 18) return 'Afternoon';
  return 'Evening';
}

function renderGreeting(user) {
  document.getElementById('greet-hi').textContent = greet() + ', ' + user.first;
  document.getElementById('greet-date').textContent =
    new Date().toLocaleDateString('en-IE',
      { weekday: 'long', day: 'numeric', month: 'long' });
}

function appletCard(a, tile) {
  const [accent, accentBg] = ACCENTS[a.accent] || ACCENTS.indigo;
  const soon    = a.status === 'soon';
  const clickable = !soon;
  const tag = soon  ? '<span class="tag tag-soon">Soon</span>'
            : a.status === 'quiet' ? '<span class="tag tag-quiet">Off-season</span>'
            : '';
  const ext = a.external ? '<span class="ext-arrow">↗</span>' : '';

  // The placeholder means "the answer is still coming", so it must only ever
  // appear while that is true. There is one paint now, after /api/dashboard has
  // settled, so a tile still missing at that point is missing for good, and
  // showing "…" for it would be a spinner that never resolves. Worse than no
  // stat at all, and exactly the case /api/dashboard produces when one table
  // fails and nulls a single tile.
  let stat = '';
  if (tile && tile.detail) {
    stat = `<div class="applet-stat"><span class="stat-dot"></span>${UCDFS.esc(tile.detail)}</div>`;
  } else if (clickable && HAS_TILE[a.id] && !TILES_LOADED) {
    stat = '<div class="applet-stat loading">…</div>';
  }

  const inner = `
    <div class="applet-icon">${a.icon || '📦'}</div>
    <div class="applet-body">
      <div class="applet-name">${UCDFS.esc(a.name)}${tag}${ext}</div>
      <div class="applet-blurb">${UCDFS.esc(a.blurb || '')}</div>
      ${stat}
    </div>`;

  const cls = `applet ${a.status === 'quiet' ? 'quiet' : ''} ${soon ? 'soon' : ''}`;
  const style = `--accent:${accent};--accent-bg:${accentBg}`;

  const card = clickable
    ? `<a class="${cls}" style="${style}" href="${UCDFS.esc(a.route)}"${
        a.external ? ' target="_blank" rel="noopener"' : ''}>${inner}</a>`
    : `<div class="${cls}" style="${style}">${inner}</div>`;

  /* The star is a sibling of the card, never a child: a <button> inside an <a>
     is invalid markup and browsers break the anchor around it. A "soon" card
     cannot be opened, so there is nothing to pin. */
  const on  = FAVOURITES.indexOf(a.id) >= 0;
  const star = soon ? '' :
    `<button class="fav-btn ${on ? 'on' : ''}" type="button" data-fav="${UCDFS.esc(a.id)}"
       title="${on ? 'Remove from favourites' : 'Add to favourites'}"
       aria-pressed="${on}" aria-label="${on ? 'Remove' : 'Add'} ${UCDFS.esc(a.name)} ${
         on ? 'from' : 'to'} favourites">${on ? '★' : '☆'}</button>`;

  return `<div class="applet-slot">${card}${star}</div>`;
}

/* Which applets the dashboard API reports on. Drives the "…" placeholder so
   cards without a tile don't sit there looking like they failed to load. */
const HAS_TILE = { attendance: 1, flowcharts: 1, pt: 1, harness: 1, comp: 1 };

let APPLETS  = [];
/* Dashboard blocks, in order, from /api/applets. Empty is fine: render() then
   draws the Tools grid and nothing else. */
let GROUPS   = [];
/* Applet ids this account has starred, newest last, straight from the server.
   Per account rather than per browser, unlike the subteam chip below. These
   are "my tools", and they should be the same on the workshop PC and a phone. */
let FAVOURITES = [];
let TILES    = {};
/* Set once /api/dashboard has settled, successfully or not. It is the
   difference between "no number yet" and "no number", which is the difference
   between a placeholder and a spinner that never stops. */
let TILES_LOADED = false;
let SUBTEAMS = [];
/* The feed as it was last drawn. Kept so a delete button can name its own row
   without the id ending up in the markup. */
let FEED     = [];
let FILTER   = 'all';

/* ── Subteam filter ──
   Filter, never hide. An `all`-tagged applet is shown under every chip, and
   clearing the filter always brings everything back. Nothing on this page can
   become unreachable because of a chip. Relevance, not permission: an Ops
   member can still open the PT plan, it just isn't the first thing they see. */
const FILTER_KEY = 'ucdfs_dash_subteam';   /* remembered per device, not per account */

function appletSubteams(a) {
  /* A missing field means "everyone". An entry that forgets to tag itself must
     stay visible rather than quietly vanishing for most of the team. */
  return (a.subteams && a.subteams.length) ? a.subteams : ['all'];
}

function visibleUnder(a, filter) {
  if (filter === 'all') return true;
  const s = appletSubteams(a);
  return s.indexOf('all') >= 0 || s.indexOf(filter) >= 0;
}

function setFilter(f) {
  FILTER = f;
  try { localStorage.setItem(FILTER_KEY, f); } catch (e) { /* private mode */ }
  render();
}

function renderChips() {
  const el = document.getElementById('subteam-chips');
  /* One subteam means no meaningful choice, so don't put a decision on screen
     that has only one answer. */
  if (!SUBTEAMS.length) { el.style.display = 'none'; return; }
  el.style.display = '';

  const chip = (id, label, accent) => {
    const n = APPLETS.filter(a => a.status !== 'soon' && visibleUnder(a, id)).length;
    const style = accent ? ` style="--chip-accent:${accent}"` : '';
    return `<button class="chip ${FILTER === id ? 'active' : ''}"${style}
              type="button" data-filter="${UCDFS.esc(id)}">
              ${UCDFS.esc(label)} <span class="chip-count">${n}</span>
            </button>`;
  };

  el.innerHTML = chip('all', 'All', '') +
    SUBTEAMS.map(s => chip(s.id, s.name, (ACCENTS[s.accent] || ACCENTS.indigo)[0])).join('');

  el.querySelectorAll('.chip').forEach(b =>
    b.addEventListener('click', () => setFilter(b.dataset.filter)));
}

/* ── Countdown ──
   Everything here comes from the season calendar at the top of main.py. */
function renderCountdown(cd) {
  const el = document.getElementById('countdown');
  if (!cd) { el.style.display = 'none'; return; }

  const when = new Date(cd.date + 'T00:00:00').toLocaleDateString('en-IE',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  let num, main, sub;
  if (cd.state === 'today') {
    num  = '🏁';
    main = cd.name + ' is today';
    sub  = 'Good luck.';
  } else if (cd.state === 'past') {
    // Not a negative countdown: a past date means the calendar needs updating.
    num  = '-';
    main = cd.name + ' has been and gone';
    sub  = 'Season calendar needs updating';
  } else {
    num  = cd.days;
    main = 'day' + (cd.days === 1 ? '' : 's') + ' to ' + cd.name;
    sub  = when;
  }

  const tag  = cd.provisional && cd.state === 'future'
    ? '<span class="cd-tag">provisional</span>' : '';
  const next = cd.next
    ? `<div class="cd-next">Next: ${UCDFS.esc(cd.next.label)} in
       ${cd.next.days} day${cd.next.days === 1 ? '' : 's'}</div>` : '';

  el.style.display = '';
  el.innerHTML = `
    <div class="cd-num">${UCDFS.esc(num)}</div>
    <div class="cd-body">
      <div class="cd-main">${UCDFS.esc(main)}</div>
      <div class="cd-sub">${UCDFS.esc(sub)}${tag}</div>
      ${next}
    </div>`;
}

/* ── Who's in the workshop right now ──
   Only rendered when someone actually is; an empty workshop is not news, and
   the headline covers "nobody has logged anything" already. */
function renderNow(att) {
  const el   = document.getElementById('nowbar');
  const here = (att && att.here) || [];
  if (!here.length) { el.style.display = 'none'; return; }

  const shown = here.slice(0, 5);
  const extra = here.length - shown.length;
  /* Photos come from the tile itself. The server already looked them up by
     name, so there is nothing extra to fetch here. */
  const avs = shown.map(p => UCDFS.avatar(p.name, p.photo, 'now-av')).join('') +
    (extra > 0 ? `<div class="now-av now-more">+${extra}</div>` : '');

  // First names only: everyone here knows everyone, and it fits on a phone.
  const firsts = here.slice(0, 3).map(p => p.name.split(' ')[0]);
  const rest   = here.length - firsts.length;
  const who    = firsts.join(', ') + (rest > 0 ? ' +' + rest : '');

  el.style.display = '';
  el.innerHTML = `
    <div class="now-avs">${avs}</div>
    <div class="now-body">
      <div class="now-main">${here.length} in the workshop now</div>
      <div class="now-sub">${UCDFS.esc(who)}${att.until ? ' · until ' + UCDFS.esc(att.until) : ''}</div>
    </div>
    <div class="now-dot"></div>`;
}

/* ── Activity feed ── */
function appletIcon(id) {
  const a = APPLETS.find(x => x.id === id);
  return (a && a.icon) || '•';
}

function renderFeed(items) {
  FEED = items || [];
  const el = document.getElementById('feed');
  if (!FEED.length) {
    el.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🌱</div>
        <div class="empty-text">Nothing logged yet. Tick something off in a build plan.</div>
      </div>`;
    return;
  }
  /* The × is drawn from the profile cookie, which is display data and grants
     nothing. /api/admin/activity/delete re-checks the database row. A forged
     cookie gets a button that 403s. */
  const me  = UCDFS.user() || {};
  const god = !!me.god_mode;

  el.innerHTML = FEED.map((i, n) => `
    <div class="feed-item">
      <div class="feed-icon">${appletIcon(i.applet)}</div>
      <div class="feed-text">
        <span class="feed-actor">${UCDFS.esc(i.actor)}</span>
        ${UCDFS.esc(i.verb)} ${UCDFS.esc(i.subject)}
      </div>
      <div class="feed-when">${UCDFS.esc(i.ago || '')}</div>
      ${god && i.id ? `<button class="feed-x" type="button" data-n="${n}"
         title="Delete this entry" aria-label="Delete this entry">×</button>` : ''}
    </div>`).join('');

  el.querySelectorAll('.feed-x').forEach(btn =>
    btn.addEventListener('click', () => deleteFeedItem(btn, FEED[+btn.dataset.n])));
}

async function deleteFeedItem(btn, item) {
  if (!item) return;
  if (!confirm(`Delete this entry?\n\n${item.actor} ${item.verb} ${item.subject}`)) return;

  btn.disabled = true;
  try {
    const r = await fetch('/api/admin/activity/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ source: item.source, id: item.id }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || 'Failed');
    /* Re-fetch rather than splice the row out. The feed is the newest eight of
       two merged tables, so removing one should pull the ninth up. A spliced
       list quietly gets shorter every time you tidy it. */
    const data = await fetch('/api/dashboard').then(x => x.json()).catch(() => null);
    if (data) renderFeed(data.activity || []);
    else btn.closest('.feed-item').remove();
    UCDFS.toast('Entry deleted');
  } catch (e) {
    btn.disabled = false;
    UCDFS.toast(e.message || "Couldn't delete that entry");
  }
}

/* Star or unstar one card.
 *
 * Drawn first, saved second. Pinning a tool is a preference, not a transaction,
 * and waiting on a round trip to move a card is the kind of lag that makes
 * people click twice. If the save fails the card goes back where it was and the
 * toast says why. The page never keeps a star the server rejected. */
async function toggleFavourite(btn) {
  const id = btn.dataset.fav;
  if (!id) return;
  const wasOn  = FAVOURITES.indexOf(id) >= 0;
  const before = FAVOURITES.slice();

  FAVOURITES = wasOn ? FAVOURITES.filter(x => x !== id) : FAVOURITES.concat([id]);
  render();

  try {
    const r = await fetch('/api/profile/favourites', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, on: !wasOn }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "Couldn't save that");
    /* Take the server's list, not the optimistic one: it owns the order and
       the cap, so a second tab or a rejected twelfth star settles here. */
    if (Array.isArray(j.favourites)) { FAVOURITES = j.favourites; render(); }
  } catch (e) {
    FAVOURITES = before;
    render();
    UCDFS.toast(e.message || "Couldn't save that");
  }
}

/* Which block a card belongs to.

   No "group" means the main Tools grid, and so does a group nobody declared.
   Same rule as the subteam filter: an entry that forgets to tag itself, or
   names a block that does not exist, must stay visible rather than quietly
   vanishing. Rendering it nowhere would be a card that exists on the server and
   cannot be found on the page. */
function appletGroup(a) {
  const g = a.group || 'tools';
  return GROUPS.some(x => x.id === g) ? g : 'tools';
}

function render() {
  const shown = APPLETS.filter(a => visibleUnder(a, FILTER));

  /* A starred card is *copied* to the top, not moved: it stays where it lives
     so the layout of the site never changes shape under you, and Favourites is
     a shortcut rather than somewhere things disappear to.

     Built from FAVOURITES rather than by filtering APPLETS, so they sit in the
     order they were starred (the only order anybody could predict), and an id
     naming a card that has since been retired simply drops out.

     Deliberately not filtered by the subteam chip. You pinned these on purpose;
     a chip hiding your own shortcuts would be the one place on this page where
     filtering costs you something. It also keeps the empty state honest, since
     "nothing pinned" then means exactly that rather than "nothing pinned that
     is also Operations". */
  const favCards = FAVOURITES
    .map(id => APPLETS.find(a => a.id === id))
    .filter(Boolean);
  const favGrid = document.getElementById('applet-favourites');
  favGrid.innerHTML = favCards.map(a => appletCard(a, TILES[a.id])).join('');
  /* Hidden rather than left empty: .applet-grid keeps its 30px bottom margin
     with no children in it, which opened a hole between the heading and the
     line of text below it. */
  favGrid.style.display = favCards.length ? '' : 'none';
  document.getElementById('fav-empty').style.display = favCards.length ? 'none' : '';

  document.getElementById('applet-grid').innerHTML = shown
    .filter(a => appletGroup(a) === 'tools')
    .map(a => appletCard(a, TILES[a.id])).join('');

  /* Every block after Tools: its own heading and grid, and rendered only if
     the filter left anything in it. A heading over an empty space reads as a
     page that failed to load. (Favourites is the exception, above: its heading
     stays because its empty state is the only thing that explains the star.) */
  document.getElementById('applet-groups').innerHTML = GROUPS
    .filter(g => g.id !== 'tools')
    .map(g => {
      const cards = shown.filter(a => appletGroup(a) === g.id);
      if (!cards.length) return '';
      return `<div class="section-label" style="margin-top:26px">${UCDFS.esc(g.label)}</div>
              <div class="applet-grid">
                ${cards.map(a => appletCard(a, TILES[a.id])).join('')}
              </div>`;
    }).join('');

  document.querySelectorAll('.fav-btn').forEach(b =>
    b.addEventListener('click', () => toggleFavourite(b)));

  renderChips();

  /* The count is of everything, not of what the filter is showing. It is a
     statement about the site, and it would be alarming for it to drop when you
     tapped a chip. */
  const live = APPLETS.filter(a => a.status !== 'soon').length;
  document.getElementById('foot-count').textContent =
    live + (live === 1 ? ' tool' : ' tools');
}

/* The headline picks the single most actionable thing across all tiles. */
function renderHeadline() {
  const att  = TILES.attendance;
  const comp = TILES.comp;
  const pt   = TILES.pt;
  let icon = '👋', main = 'Nothing needs you right now', sub = '';

  if (comp && comp.pending > 0) {
    icon = '🛒';
    main = `${comp.pending} shop request${comp.pending === 1 ? '' : 's'} still pending`;
    sub  = 'Competition Hub · waiting to be bought';
  } else if (att && att.in > 0 && !att.now) {
    // Only when nobody is in *right now*. Otherwise the nowbar below says it
    // better, and the headline would be repeating itself.
    icon = '🔧';
    main = `${att.in} ${att.in === 1 ? 'person is' : 'people are'} in the workshop today`;
    sub  = att.logged > att.in
      ? `${att.logged} people have logged attendance` : 'From today\'s attendance log';
  } else if (pt && pt.in_progress > 0) {
    icon = '🏎️';
    main = `${pt.in_progress} PT task${pt.in_progress === 1 ? '' : 's'} in progress`;
    sub  = `${pt.pct}% of the build plan complete`;
  } else if (att && att.logged === 0) {
    icon = '📋';
    main = 'Nobody has logged attendance today';
    sub  = 'Tap Attendance to say whether you\'re coming in';
  }

  document.getElementById('headline').innerHTML = `
    <div class="headline-icon">${icon}</div>
    <div class="headline-body">
      <div class="headline-main">${UCDFS.esc(main)}</div>
      ${sub ? `<div class="headline-sub">${UCDFS.esc(sub)}</div>` : ''}
    </div>`;
}

/* ── Showing the page ──────────────────────────────────────────────────────
   The dashboard stays hidden until it has been drawn once, so nobody watches
   it build itself. See the .page rule in the style block.

   reveal() is idempotent and called from exactly two places, because the only
   thing worse than a page that flickers is a page that never arrives. boot()
   calls it in a finally, which covers both a clean draw and a thrown one; the
   timeout covers the case where boot never returns at all. Fetch has no
   timeout of its own, so a request that never settles would otherwise leave a
   permanently blank page. Failures degrade, they do not blank.

   Do not add a third call at the end of draw(): the finally already runs on
   the success path, and a spare call only makes this comment wrong. */
let revealed = false;
function reveal() {
  if (revealed) return;
  revealed = true;
  document.body.classList.add('ready');
}
setTimeout(reveal, 2500);

async function boot(user) {
  try {
    await draw(user);
  } finally {
    reveal();
  }
}

async function draw(user) {
  UCDFS.renderPill();
  renderGreeting(user);

  /* Default the filter to your own subteam, unless this device has a
     preference. Someone who deliberately switched to All meant it. */
  let saved = null;
  try { saved = localStorage.getItem(FILTER_KEY); } catch (e) { /* private mode */ }
  FILTER = saved || user.subteam || 'all';

  /* Three requests at once, not two then a third.
     /api/dashboard used to be awaited only after the other two had already
     painted the grid, so the page assembled itself in front of you: tools
     first, then the headline and feed a beat later, with a "…" in every tile
     in between. Nothing in /api/dashboard depends on the other two, so there
     was never a reason for it to wait its turn. This is one round trip now
     rather than two, so it is also simply faster.

     Each request swallows its own failure. A dashboard that cannot reach the
     feed should still draw its tools, which is the same rule /api/dashboard
     already follows server-side when one table is unhappy. */
  const [applets, groups, favourites, subteams, data] = await Promise.all([
    UCDFS.applets().catch(() => []),
    /* All three share the one cached request, not three round trips. */
    UCDFS.appletGroups().catch(() => []),
    UCDFS.favourites().catch(() => []),
    fetch('/api/subteams').then(r => r.json()).then(j => j.subteams || []).catch(() => []),
    fetch('/api/dashboard').then(r => r.json()).catch(() => ({})),
  ]);
  APPLETS    = applets;
  GROUPS     = groups;
  FAVOURITES = favourites;
  SUBTEAMS   = subteams;
  TILES    = data.tiles || {};
  TILES_LOADED = true;   // settled. See the placeholder rule in appletCard()
  /* A subteam that no longer exists must not leave the grid filtered to
     nothing, so fall back to All. */
  if (FILTER !== 'all' && !SUBTEAMS.some(s => s.id === FILTER)) FILTER = 'all';

  /* One paint. Everything below reads state that is already in hand, so the
     tiles are drawn with their numbers the first time rather than filled in
     afterwards. */
  render();
  renderHeadline();
  renderCountdown(data.countdown);
  renderNow(TILES.attendance);
  renderFeed(data.activity);

  /* The subteam step lives in shared.js now, so it fires wherever someone
     lands: a bookmarked /harness, not just here. This page cares because
     picking a subteam should move the filter it just drew. */
  UCDFS.onboard(picked => {
    if (picked) setFilter(picked);
    renderGreeting(UCDFS.refreshUser() || user);
  });
}

UCDFS.gate(boot);
</script>
